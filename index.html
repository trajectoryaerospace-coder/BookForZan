<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>For Zanieke</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Georgia, "Times New Roman", serif;
}

/* =========================
   BACKGROUND
========================= */

body {
    background:
        radial-gradient(circle at 20% 30%, rgba(255,255,255,.45), transparent 25%),
        radial-gradient(circle at 80% 70%, rgba(255,255,255,.35), transparent 25%),
        linear-gradient(135deg, #f7b6c8, #f8cbd7, #ed9fb9);
    position: relative;
}

/* Animated silky waves */

.wave {
    position: absolute;
    width: 180%;
    height: 45%;
    left: -40%;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,.25);
    filter: blur(1px);
    animation: waveMove 9s ease-in-out infinite alternate;
}

.wave:nth-child(1) {
    top: 5%;
    transform: rotate(-7deg);
}

.wave:nth-child(2) {
    top: 30%;
    animation-delay: -3s;
    transform: rotate(8deg);
}

.wave:nth-child(3) {
    top: 60%;
    animation-delay: -6s;
    transform: rotate(-5deg);
}

@keyframes waveMove {
    from {
        transform: translateX(-4%) rotate(-6deg) scaleY(.9);
    }
    to {
        transform: translateX(4%) rotate(6deg) scaleY(1.1);
    }
}

/* Soft floating petals */

.petal {
    position: absolute;
    width: 24px;
    height: 13px;
    background: rgba(255, 235, 242, .65);
    border-radius: 100% 0 100% 0;
    animation: floatPetal 10s linear infinite;
}

.p1 { left: 8%; top: 20%; animation-delay: -2s; }
.p2 { left: 75%; top: 15%; animation-delay: -6s; }
.p3 { left: 87%; top: 72%; animation-delay: -4s; }
.p4 { left: 17%; top: 76%; animation-delay: -8s; }

@keyframes floatPetal {
    0% {
        transform: translateY(20px) rotate(0deg);
        opacity: .3;
    }
    50% {
        opacity: .8;
    }
    100% {
        transform: translateY(-80px) rotate(180deg);
        opacity: 0;
    }
}

/* =========================
   BOOK AREA
========================= */

.scene {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 1800px;
}

/*
The book starts slightly to the left.
When opened, the whole book moves left so
the TWO pages are centered.
*/

.book {
    width: min(34vw, 310px);
    aspect-ratio: .68;
    position: relative;
    transform-style: preserve-3d;
    transition:
        transform 1.25s cubic-bezier(.2,.8,.2,1);
    cursor: pointer;
}

/* =========================
   CLOSED BOOK
========================= */

.cover {
    position: absolute;
    inset: 0;
    border-radius: 7px 12px 12px 7px;

    background:
        linear-gradient(
            135deg,
            #f9d1dc,
            #efabbf 50%,
            #e99eb5
        );

    border: 3px solid #d99aaa;

    box-shadow:
        10px 15px 30px rgba(100,40,65,.28),
        inset 0 0 0 3px rgba(255,255,255,.3),
        inset 0 0 25px rgba(150,50,80,.15);

    transform-origin: left center;
    transform-style: preserve-3d;
    transition:
        transform 1.35s cubic-bezier(.2,.8,.2,1);
    z-index: 5;
}

/* Gold inner border */

.cover::before {
    content: "";
    position: absolute;
    inset: 12px;
    border: 1px solid rgba(160,100,100,.6);
    border-radius: 4px;
    pointer-events: none;
}

.cover::after {
    content: "✦";
    position: absolute;
    top: 13%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 22px;
    color: #bd806f;
}

/* Spine */

.spine {
    position: absolute;
    left: -10px;
    top: -3px;
    width: 16px;
    height: calc(100% + 6px);
    border-radius: 8px 0 0 8px;

    background: linear-gradient(
        90deg,
        #c98298,
        #f2c1cc,
        #c98298
    );

    border: 2px solid #c17d92;
}

/* =========================
   COVER DECORATION
========================= */

.decor {
    position: absolute;
    inset: 28px;
    border: 1px solid rgba(170,100,100,.55);
    pointer-events: none;
}

.corner {
    position: absolute;
    color: #bd806f;
    font-size: 27px;
}

.c1 { top: 18px; left: 18px; }
.c2 { top: 18px; right: 18px; transform: scaleX(-1); }
.c3 { bottom: 18px; left: 18px; transform: scaleY(-1); }
.c4 { bottom: 18px; right: 18px; transform: scale(-1); }

.flower {
    position: absolute;
    color: #d7869c;
    font-size: 30px;
}

.f1 { top: 18px; left: 25%; }
.f2 { top: 18px; right: 25%; }
.f3 { bottom: 18px; left: 25%; }
.f4 { bottom: 18px; right: 25%; }

.bow {
    position: absolute;
    top: 13%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 31px;
    color: #bd806f;
}

/* =========================
   COVER TEXT
========================= */

.cover-content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 35px;
    color: #a85f73;
}

.cover-content h1 {
    font-size: clamp(23px, 4vw, 38px);
    line-height: 1.2;
    font-weight: normal;
    font-style: italic;
    text-shadow: 0 1px rgba(255,255,255,.5);
}

.cover-content .heart {
    margin: 15px 0;
    font-size: 25px;
}

.cover-content .open-text {
    font-size: clamp(12px, 2vw, 17px);
    opacity: .8;
    letter-spacing: 1px;
}

/* =========================
   OPEN BOOK
========================= */

.pages {
    position: absolute;
    width: 200%;
    height: 100%;
    left: 0;
    top: 0;

    display: flex;

    opacity: 0;
    pointer-events: none;

    transform: translateX(0) scale(.96);

    transition:
        opacity .5s ease .75s,
        transform 1.25s cubic-bezier(.2,.8,.2,1);
}

/* Individual page */

.page {
    width: 50%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            #f6eee3,
            #fffaf1,
            #f3e8da
        );

    border: 1px solid #d8c6b4;

    box-shadow:
        inset 0 0 25px rgba(100,70,40,.08);
}

/* Left page */

.page.left {
    border-radius: 8px 0 0 8px;
    transform-origin: right center;
}

/* Right page */

.page.right {
    border-radius: 0 8px 8px 0;
    transform-origin: left center;
}

/* Center crease */

.page.left::after {
    content: "";
    position: absolute;
    right: 0;
    top: 2%;
    height: 96%;
    width: 5px;
    background: linear-gradient(
        90deg,
        transparent,
        rgba(100,70,50,.16),
        transparent
    );
}

/* =========================
   OPEN STATE
========================= */

.book.open {
    /*
    Move the book left by half its width,
    because the open book is twice as wide.
    */
    transform: translateX(calc(-50% + 8px));
}

.book.open .cover {
    transform: rotateY(-180deg);
}

.book.open .pages {
    opacity: 1;
    pointer-events: auto;
    transform: translateX(0) scale(1);
}

/* Make cover disappear behind pages */

.book.open .cover {
    z-index: 0;
}

/* =========================
   PAGE CONTENT
========================= */

.page-content {
    width: 100%;
    height: 100%;
    padding: 9%;
    color: #80666a;
    text-align: center;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: clamp(13px, 2vw, 18px);
}

.page-content span {
    opacity: .45;
    font-style: italic;
}

/* =========================
   LANDSCAPE ONLY
========================= */

@media (orientation: portrait) {
    body::before {
        content: "Please turn your phone sideways ♡";
        position: fixed;
        inset: 0;
        z-index: 9999;

        display: flex;
        align-items: center;
        justify-content: center;

        background: linear-gradient(135deg, #f4b2c5, #f8d4df);

        color: #9c6071;
        font-family: Georgia, serif;
        font-size: 22px;
        text-align: center;
        padding: 30px;
    }
}
</style>
</head>

<body>

<!-- Background -->
<div class="wave"></div>
<div class="wave"></div>
<div class="wave"></div>

<div class="petal p1"></div>
<div class="petal p2"></div>
<div class="petal p3"></div>
<div class="petal p4"></div>


<div class="scene">

    <div class="book" id="book">

        <!-- ================= COVER ================= -->

        <div class="cover">

            <div class="spine"></div>

            <div class="decor"></div>

            <div class="corner c1">❧</div>
            <div class="corner c2">❧</div>
            <div class="corner c3">❧</div>
            <div class="corner c4">❧</div>

            <div class="flower f1">✿</div>
            <div class="flower f2">✿</div>
            <div class="flower f3">✿</div>
            <div class="flower f4">✿</div>

            <div class="bow">୨୧</div>

            <div class="cover-content">

                <h1>
                    Sorry for<br>
                    everything<br>
                    Zanieke
                </h1>

                <div class="heart">♡</div>

                <div class="open-text">
                    (click to open)
                </div>

            </div>

        </div>


        <!-- ================= OPEN PAGES ================= -->

        <div class="pages">

            <div class="page left">
                <div class="page-content">
                    <span>
                        <!-- We can put whatever you want here later -->
                    </span>
                </div>
            </div>

            <div class="page right">
                <div class="page-content">
                    <span>
                        <!-- We can put whatever you want here later -->
                    </span>
                </div>
            </div>

        </div>

    </div>

</div>


<script>

const book = document.getElementById("book");

book.addEventListener("click", () => {
    if (!book.classList.contains("open")) {
        book.classList.add("open");
    }
});

</script>

</body>
</html>
