<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>For Zanieke ♡</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background:
        radial-gradient(
            ellipse at 50% 40%,
            rgba(255,255,255,.65),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #f4b1c3 0%,
            #f9ccd8 45%,
            #ed9fb8 100%
        );

    font-family: Georgia, "Times New Roman", serif;
}


/* =========================================================
   PINK LIQUID / SILK BACKGROUND
========================================================= */

.background {
    position: fixed;
    inset: -20%;
    overflow: hidden;
}

.wave {
    position: absolute;

    width: 140%;
    height: 35%;

    left: -20%;

    border-radius: 50%;

    border-top: 2px solid rgba(255,255,255,.48);
    border-bottom: 1px solid rgba(255,255,255,.18);

    filter: blur(2px);

    animation:
        waveFloat 12s ease-in-out infinite alternate;
}

.wave:nth-child(1) {
    top: 2%;
    transform: rotate(-7deg);
}

.wave:nth-child(2) {
    top: 27%;
    transform: rotate(6deg);
    animation-delay: -3s;
}

.wave:nth-child(3) {
    top: 55%;
    transform: rotate(-5deg);
    animation-delay: -6s;
}

.wave:nth-child(4) {
    top: 78%;
    transform: rotate(7deg);
    animation-delay: -9s;
}

@keyframes waveFloat {

    from {
        transform:
            translateX(-4%)
            rotate(-6deg)
            scaleY(.92);
    }

    to {
        transform:
            translateX(4%)
            rotate(6deg)
            scaleY(1.08);
    }
}


/* =========================================================
   LIGHT SHIMMER
========================================================= */

.shimmer {
    position: absolute;

    width: 180%;
    height: 20%;

    left: -40%;
    top: 40%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.3),
            transparent
        );

    transform: rotate(-8deg);

    filter: blur(15px);

    animation: shimmerMove 8s ease-in-out infinite;
}

@keyframes shimmerMove {

    0% {
        transform:
            translateX(-20%)
            rotate(-8deg);
    }

    100% {
        transform:
            translateX(20%)
            rotate(-8deg);
    }
}


/* =========================================================
   PETALS
========================================================= */

.petal {
    position: absolute;

    width: 28px;
    height: 16px;

    border-radius:
        100% 0
        100% 0;

    background:
        linear-gradient(
            135deg,
            rgba(255,244,248,.85),
            rgba(239,166,189,.55)
        );

    box-shadow:
        0 3px 8px rgba(130,60,80,.08);

    animation: petalFloat 9s linear infinite;
}

.petal:nth-child(1) {
    left: 8%;
    top: 22%;
    animation-delay: -2s;
}

.petal:nth-child(2) {
    left: 75%;
    top: 17%;
    animation-delay: -5s;
}

.petal:nth-child(3) {
    left: 88%;
    top: 73%;
    animation-delay: -1s;
}

.petal:nth-child(4) {
    left: 15%;
    top: 78%;
    animation-delay: -7s;
}

@keyframes petalFloat {

    0% {
        opacity: .1;
        transform:
            translateY(30px)
            rotate(0deg);
    }

    40% {
        opacity: .8;
    }

    100% {
        opacity: 0;
        transform:
            translateY(-100px)
            translateX(30px)
            rotate(180deg);
    }
}


/* =========================================================
   SCENE
========================================================= */

.scene {

    position: absolute;
    inset: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    perspective: 2200px;
}


/* =========================================================
   BOOK

   70% OF THE ORIGINAL SIZE
========================================================= */

.book {

    /*
       Previous:
       width: min(34vw, 310px)

       Now approximately 70%.
    */

    width: min(24vw, 220px);

    aspect-ratio: .70;

    position: relative;

    transform-style: preserve-3d;

    /*
       Closed book starts centered.
    */

    transform:
        translateX(0)
        translateZ(0);

    transition:
        transform 1.4s
        cubic-bezier(.18,.82,.2,1);

    cursor: pointer;
}


/* =========================================================
   BOOK SHADOW
========================================================= */

.book-shadow {

    position: absolute;

    width: 110%;
    height: 13%;

    left: -5%;
    bottom: -8%;

    border-radius: 50%;

    background:
        rgba(80,35,50,.25);

    filter: blur(18px);

    transform:
        translateZ(-30px);

    transition:
        transform 1.4s ease,
        opacity 1s ease;
}


/* =========================================================
   PAGE BLOCK

   IMPORTANT:
   This exists UNDER the cover BEFORE opening.
========================================================= */

.page-block {

    position: absolute;

    inset: 2px 0 2px 5px;

    border-radius:
        3px
        9px
        9px
        3px;

    background:

        repeating-linear-gradient(
            to bottom,
            #fffaf0 0px,
            #fffaf0 2px,
            #e7dccd 3px,
            #fffaf0 4px
        );

    box-shadow:

        5px 6px 12px
        rgba(80,40,50,.18),

        inset -5px 0 8px
        rgba(130,90,70,.08);

    transform:
        translateZ(-5px);

    z-index: 1;
}


/* =========================================================
   PAGE EDGES
========================================================= */

.page-edge {

    position: absolute;

    right: -5px;

    width: 5px;

    height: 96%;

    top: 2%;

    background:

        repeating-linear-gradient(
            to bottom,
            #f8f0e4 0px,
            #f8f0e4 2px,
            #d8cbbb 3px,
            #f8f0e4 4px
        );

    border-radius: 0 5px 5px 0;
}


/* =========================================================
   ACTUAL OPEN BOOK

   TWO REAL PAGE HALVES
========================================================= */

.open-book {

    position: absolute;

    width: 200%;
    height: 100%;

    left: 0;
    top: 0;

    display: flex;

    transform-style: preserve-3d;

    z-index: 2;

    pointer-events: none;
}


/* =========================================================
   INDIVIDUAL OPEN PAGE
========================================================= */

.open-page {

    position: relative;

    width: 50%;
    height: 100%;

    background:

        linear-gradient(
            90deg,
            #e7d9c9 0%,
            #faf4e9 5%,
            #fffaf0 50%,
            #f5ecdf 100%
        );

    border: 1px solid #d6c5b4;

    box-shadow:
        inset 0 0 25px
        rgba(100,65,45,.08);

    overflow: hidden;
}


/* left page */

.open-page.left {

    border-radius:
        9px 0 0 9px;

    transform-origin:
        right center;
}


/* right page */

.open-page.right {

    border-radius:
        0 9px 9px 0;

    transform-origin:
        left center;
}


/* =========================================================
   CENTER CREASE
========================================================= */

.open-page.left::after {

    content: "";

    position: absolute;

    right: -2px;
    top: 2%;

    width: 5px;
    height: 96%;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(80,55,45,.18),
            transparent
        );

    filter: blur(.5px);
}


/* =========================================================
   COVER

   This is the important bit.
   It physically rotates around the spine.
========================================================= */

.cover {

    position: absolute;

    inset: 0;

    z-index: 10;

    transform-style: preserve-3d;

    transform-origin:
        left center;

    border-radius:
        5px
        10px
        10px
        5px;

    background:

        linear-gradient(
            135deg,
            #f8d4de 0%,
            #efb0c2 48%,
            #e89fb6 100%
        );

    border:
        2px solid #d99aaa;

    box-shadow:

        8px 12px 24px
        rgba(90,40,60,.25),

        inset 0 0 0 3px
        rgba(255,255,255,.27),

        inset 0 0 25px
        rgba(150,60,80,.12);

    transition:

        transform
        1.55s
        cubic-bezier(.16,.85,.18,1);
}


/* =========================================================
   COVER INNER BORDER
========================================================= */

.cover-inner {

    position: absolute;

    inset: 9px;

    border:
        1px solid
        rgba(170,100,110,.55);

    border-radius: 4px;
}


/* =========================================================
   COVER CORNERS
========================================================= */

.corner {

    position: absolute;

    color: #b97883;

    font-size: 24px;

    opacity: .9;
}

.corner.tl {
    left: 16px;
    top: 13px;
}

.corner.tr {
    right: 16px;
    top: 13px;
    transform: scaleX(-1);
}

.corner.bl {
    left: 16px;
    bottom: 13px;
    transform: scaleY(-1);
}

.corner.br {
    right: 16px;
    bottom: 13px;
    transform: scale(-1);
}


/* =========================================================
   FLOWERS
========================================================= */

.flower {

    position: absolute;

    color: #d8879c;

    font-size: 25px;

    text-shadow:
        0 1px rgba(255,255,255,.4);
}

.flower.f1 {
    top: 14px;
    left: 30px;
}

.flower.f2 {
    top: 14px;
    right: 30px;
}

.flower.f3 {
    bottom: 14px;
    left: 30px;
}

.flower.f4 {
    bottom: 14px;
    right: 30px;
}


/* =========================================================
   BOW
========================================================= */

.bow {

    position: absolute;

    top: 13%;

    left: 50%;

    transform:
        translateX(-50%);

    color: #b97883;

    font-size: 26px;
}


/* =========================================================
   COVER TEXT
========================================================= */

.cover-text {

    position: absolute;

    inset: 0;

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;

    color: #a95e72;

    padding: 25px;
}

.cover-text h1 {

    font-size:
        clamp(18px, 3.1vw, 30px);

    line-height: 1.18;

    font-weight: normal;

    font-style: italic;

    text-shadow:
        0 1px rgba(255,255,255,.5);
}

.cover-heart {

    margin-top: 13px;

    font-size: 23px;
}

.click-text {

    margin-top: 13px;

    font-size:
        clamp(9px, 1.4vw, 13px);

    letter-spacing: .8px;

    opacity: .72;
}


/* =========================================================
   RIBBON
========================================================= */

.ribbon {

    position: absolute;

    bottom: 0;

    left: 50%;

    width: 12px;

    height: 22%;

    transform:
        translateX(-50%);

    background:
        linear-gradient(
            90deg,
            #d78ba0,
            #efb1c0,
            #d78ba0
        );

    opacity: .8;

    z-index: -1;
}


/* =========================================================
   OPENING ANIMATION
========================================================= */

/*
   The entire book shifts left by approximately half
   the book width.

   This means the open spread ends up centered.
*/

.book.open {

    transform:
        translateX(
            calc(-50% + 4px)
        )
        translateZ(0);
}


/*
   THE COVER ACTUALLY OPENS.

   Instead of disappearing sideways,
   it rotates around its LEFT SPINE.
*/

.book.open .cover {

    transform:
        rotateY(-175deg);

    box-shadow:

        -4px 10px 20px
        rgba(70,35,45,.12);
}


/*
   Pages are already physically there.
   They don't simply fade in.

   They become interactive after opening.
*/

.book.open .open-book {

    pointer-events: auto;
}


/* =========================================================
   PAGE CONTENT
========================================================= */

.page-content {

    position: absolute;

    inset: 0;

    padding: 9%;

    display: flex;

    align-items: center;
    justify-content: center;

    text-align: center;

    color: #80656b;

    font-size:
        clamp(11px, 1.7vw, 16px);
}

.page-content .placeholder {

    opacity: .35;

    font-style: italic;
}


/* =========================================================
   PAGE DECORATION
========================================================= */

.page-decoration {

    position: absolute;

    inset: 8%;

    border:
        1px solid
        rgba(180,145,120,.22);

    pointer-events: none;
}


/* =========================================================
   LITTLE GOLD SPARKLES
========================================================= */

.sparkle {

    position: absolute;

    color: rgba(255,255,255,.8);

    font-size: 14px;

    animation:
        sparkle 3s ease-in-out infinite;
}

.sparkle.s1 {
    left: 20%;
    top: 25%;
}

.sparkle.s2 {
    right: 18%;
    top: 65%;
    animation-delay: -1s;
}

.sparkle.s3 {
    left: 78%;
    top: 30%;
    animation-delay: -2s;
}

@keyframes sparkle {

    0%,100% {
        opacity: .15;
        transform: scale(.7);
    }

    50% {
        opacity: .8;
        transform: scale(1.2);
    }
}


/* =========================================================
   PORTRAIT WARNING
========================================================= */

@media (orientation: portrait) {

    body::before {

        content:
            "Please turn your phone sideways ♡";

        position: fixed;

        inset: 0;

        z-index: 99999;

        display: flex;

        align-items: center;
        justify-content: center;

        text-align: center;

        padding: 30px;

        background:
            linear-gradient(
                135deg,
                #f4b1c3,
                #f8d4df
            );

        color: #9d6072;

        font-family:
            Georgia,
            serif;

        font-size: 20px;
    }
}

</style>
</head>


<body>


<!-- =====================================================
     BACKGROUND
===================================================== -->

<div class="background">

    <div class="wave"></div>
    <div class="wave"></div>
    <div class="wave"></div>
    <div class="wave"></div>

    <div class="shimmer"></div>

    <div class="petal"></div>
    <div class="petal"></div>
    <div class="petal"></div>
    <div class="petal"></div>

    <div class="sparkle s1">✦</div>
    <div class="sparkle s2">✧</div>
    <div class="sparkle s3">✦</div>

</div>


<!-- =====================================================
     BOOK
===================================================== -->

<div class="scene">

    <div class="book" id="book">

        <div class="book-shadow"></div>


        <!-- =============================================
             PAGE BLOCK UNDER THE COVER
        ============================================== -->

        <div class="page-block">
            <div class="page-edge"></div>
        </div>


        <!-- =============================================
             OPEN BOOK
        ============================================== -->

        <div class="open-book">

            <!-- LEFT PAGE -->

            <div class="open-page left">

                <div class="page-decoration"></div>

                <div class="page-content">

                    <span class="placeholder">
                        <!-- Your message will go here -->
                    </span>

                </div>

            </div>


            <!-- RIGHT PAGE -->

            <div class="open-page right">

                <div class="page-decoration"></div>

                <div class="page-content">

                    <span class="placeholder">
                        <!-- Your message will go here -->
                    </span>

                </div>

            </div>

        </div>


        <!-- =============================================
             COVER
        ============================================== -->

        <div class="cover">

            <div class="cover-inner"></div>

            <div class="ribbon"></div>

            <div class="corner tl">❧</div>
            <div class="corner tr">❧</div>
            <div class="corner bl">❧</div>
            <div class="corner br">❧</div>

            <div class="flower f1">✿</div>
            <div class="flower f2">✿</div>
            <div class="flower f3">✿</div>
            <div class="flower f4">✿</div>

            <div class="bow">୨୧</div>


            <div class="cover-text">

                <h1>
                    Sorry for<br>
                    everything<br>
                    Zanieke
                </h1>

                <div class="cover-heart">
                    ♡
                </div>

                <div class="click-text">
                    (click to open)
                </div>

            </div>

        </div>

    </div>

</div>


<script>

const book = document.getElementById("book");

book.addEventListener("click", () => {

    if (!book.classList.contains("open")) {

        book.classList.add("open");

    }

});

</script>

</body>
</html>
```
